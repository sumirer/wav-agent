appId: com.wavagent.app
productName: WAV Agent
copyright: Copyright © 2026 WAV Agent
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - skills/**/*
  - package.json
extraMetadata:
  main: dist-electron/main.js
asarUnpack:
  - skills/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: WAV Agent
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.music
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  title: ${productName} ${version}
linux:
  target:
    - AppImage
  category: AudioVideo
